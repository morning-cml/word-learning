{% extends "base.html" %}

{% block head %}<link rel="stylesheet" href="/static/css/reader.css">{% endblock %}
{% block body_data %} data-article-id="{{ params.article_id }}"{% endblock %}

{% block body %}
<div class="reader-bar">
  <div class="segmented" id="modes">
    <button type="button" data-mode="en" class="on">英文</button>
    <button type="button" data-mode="zh">中文</button>
    <button type="button" data-mode="both">对照</button>
    <button type="button" data-mode="cloze" title="把生词挖空，先回忆再验证">回忆</button>
  </div>
  <button class="btn-sm" id="marks" type="button">高亮：开</button>
  <button class="btn-sm" id="focus" type="button" aria-pressed="false"
          title="专注模式：收起顶栏（F）">专注</button>

  <span class="typo-wrap">
    <button class="btn-sm" id="typo" type="button" aria-expanded="false"
            aria-controls="typoPop" title="字号与栏宽">Aa</button>
    <div class="typo-pop" id="typoPop" hidden>
      <div class="typo-row">
        <span>字号</span>
        <button type="button" data-typo="size" data-step="-1" aria-label="调小字号">−</button>
        <output id="typoSize"></output>
        <button type="button" data-typo="size" data-step="1" aria-label="调大字号">+</button>
      </div>
      <div class="typo-row">
        <span>栏宽</span>
        <button type="button" data-typo="measure" data-step="-1" aria-label="调窄栏宽">−</button>
        <output id="typoMeasure"></output>
        <button type="button" data-typo="measure" data-step="1" aria-label="调宽栏宽">+</button>
      </div>
      <button class="typo-reset" id="typoReset" type="button">恢复默认</button>
    </div>
  </span>
  <button class="btn-sm" id="reveal" type="button" hidden>全部揭示</button>
  <span class="cloze-progress" id="progress" hidden></span>
  <span class="spacer"></span>
  <span class="bar-hint" id="barHint">点句子翻译该句 · 点生词看全部语境</span>
</div>

<main class="reader-body">
  <article class="doc" id="doc"></article>

  <div class="card" id="statsCard" style="max-width:var(--measure);margin:var(--sp-8) auto 0" hidden>
    <div class="card-head"><h2>这篇的数据</h2></div>
    <div id="stats"></div>
  </div>
</main>

<aside class="panel" id="panel"></aside>
{% endblock %}
