   图形就是这个产品的一句话：一页文字，其中一行被荧光笔划过。
   荧光笔那道用两条重叠的线画（粗的浅色在下、细的深色在上），
   和正文里目标词的处理是同一件事。

   内联 SVG 而不是图片：能用 currentColor 和 var(--target)，
   所以它跟着深浅主题走，不用准备两张图；尺寸由 CSS 的 .mark 给。

   要改图形就改这一个文件。抄第二份出去，迟早两处长得不一样
   （需要注意.md 第 20 条）。favicon 是唯一的例外，理由写在 base.html 那行。 #}
